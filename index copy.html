<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <style type="text/tailwindcss">
      @theme {
        --color-brand-accent: #E35336;   /* Color principal de marca (highlights) */
        --color-brand-card: #FFFFFF;     /* Tarjetas blancas para contraste */
        --color-brand-hover: #FDFBF5;     /* Hover suave en tarjetas */
        --color-brand-border: rgba(227, 83, 54, 0.2); /* Bordes con tinte del acento */
        
        /* Colores de texto */
        --color-text-main: #1A1A1A;      /* Texto principal casi negro */
        --color-text-muted: #4A4A4A;     /* Texto secundario gris oscuro */
      }

      .montserrat {
        font-family: "Montserrat", sans-serif;
        font-optical-sizing: auto;
        font-weight: 700;
        font-style: normal;
      }
    </style>
  </head>
  <body class="text-text-main min-h-screen flex flex-col justify-between p-6 font-sans relative overflow-x-hidden">

    <!-- CAPA 1: Imagen de Fondo Difuminada (Blur Suave) -->
    <div 
      class="absolute inset-0 w-full h-full bg-cover bg-center bg-no-repeat filter blur-[3px] scale-105 -z-20 opacity-90"
      style="background-image: url('background-alt.jpg');">
    </div>

    <!-- CAPA 2: Capa Filtro Ligera para Garantizar Legibilidad -->
    <div class="absolute inset-0 bg-[#EDE8D0]/40 -z-10"></div>

    <!-- Contenedor Principal -->
    <main class="max-w-md w-full mx-auto flex flex-col items-center pt-12 pb-16 relative z-10">
  
      <!-- Foto de Perfil con Anillo de Brillo -->
      <div class="relative group">
        <div
          class="absolute -inset-0.5 bg-gradient-to-r from-brand-accent to-orange-600 rounded-full blur opacity-50 group-hover:opacity-75 transition duration-500">
        </div>
        <img class="relative rounded-full w-24 h-24 object-cover border-4 border-white shadow-md"
          src="logo.png"
          alt="Foto de perfil" />
      </div>
  
      <!-- Nombre e Info del Perfil -->
      <h1 class="text-2xl font-bold mt-5 tracking-tight text-text-main montserrat drop-shadow-sm">MeetDaan Burger House</h1>
      <p class="text-brand-accent text-sm font-semibold mt-1 flex items-center gap-1.5 drop-shadow-sm">
        <i class="fa-solid fa-fire text-xs"></i> L-S:10am-3pm y 6pm-10pm
      </p>
      <p class="text-text-muted text-sm mt-3 text-center px-4 max-w-sm leading-relaxed font-medium">
        Hamburguesas artesanales estilo americano, alitas ahumadas, salchis y más.
      </p>
  
      <!-- Bloque de Enlaces -->
      <div class="w-full space-y-4 mt-8">
  
        <!-- Enlace Destacado -->
        <a href="https://wa.me/51963877851?text=%C2%A1Quiero%20ordenar%21" target="_blank" rel="noopener noreferrer"
          class="flex items-center justify-center gap-3 w-full px-6 py-4 bg-brand-card/90 backdrop-blur-md hover:bg-brand-hover border border-brand-border hover:border-brand-accent rounded-xl transition-all duration-300 transform hover:-translate-y-1 text-center font-medium text-text-main hover:text-brand-accent shadow-md">
          <i class="fa-brands fa-whatsapp text-brand-accent text-lg"></i> Haz tu pedido por delivery
        </a>
  
        <!-- Enlace Estándar 1 -->
        <a href="https://cdn.jsdelivr.net/gh/MeetDaan/linktree@main/menu.pdf" target="_blank" rel="noopener noreferrer"
          class="flex items-center justify-center gap-3 w-full px-6 py-4 bg-brand-card/90 backdrop-blur-md hover:bg-brand-hover border border-brand-border hover:border-brand-accent rounded-xl transition-all duration-300 transform hover:-translate-y-1 text-center font-medium text-text-main hover:text-brand-accent shadow-md">
          <i class="fa-solid fa-burger text-brand-accent text-lg"></i> Nuestra carta digital
        </a>
  
        <!-- Enlace Estándar 2 -->
        <a href="https://maps.app.goo.gl/ccMWwHEi8xHeb8b67" target="_blank" rel="noopener noreferrer"
          class="flex items-center justify-center gap-3 w-full px-6 py-4 bg-brand-card/90 backdrop-blur-md hover:bg-brand-hover border border-brand-border hover:border-brand-accent rounded-xl transition-all duration-300 transform hover:-translate-y-1 text-center font-medium text-text-main hover:text-brand-accent shadow-md">
          <i class="fa-solid fa-map-pin text-brand-accent text-lg"></i> ¿Cómo llegar?
        </a>
  
      </div>
  
      <!-- Iconos de Redes Sociales -->
      <div class="flex space-x-6 mt-10 text-text-main text-2xl">
        <a href="https://www.facebook.com/110404261641816" class="hover:text-brand-accent transition-colors duration-200" title="Facebook">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="https://www.instagram.com/meetdaanburgers/" class="hover:text-brand-accent transition-colors duration-200" title="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="https://wa.me/51963877851" class="hover:text-brand-accent transition-colors duration-200" title="WhatsApp">
          <i class="fa-brands fa-whatsapp"></i>
        </a>
        <a href="https://www.tiktok.com/@meetdaan_burgerhouse" class="hover:text-brand-accent transition-colors duration-200" title="TikTok">
          <i class="fa-brands fa-tiktok"></i>
        </a>
      </div>
  
    </main>
  
    <!-- Footer -->
    <footer class="text-center text-xs text-text-muted pb-4 relative">
      © 2026 desarrollado por <a href="https://www.aetheroniot.com/" class="hover:text-brand-accent font-medium">Aetheron</a>
    </footer>

  </body>
</html>
